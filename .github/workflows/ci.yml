name: CI

on:
  push:
    branches: [main, "v2*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Throwaway Postgres + pgvector, only for this job. It makes tests/test_pg_backend.py run
    # instead of being skipped. No secrets involved: the database dies with the job.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5433/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit + integration tests (fake embedder, mock LLM - no API key needed)
        run: pytest -rs
      - name: Postgres tests really ran (fail if they were skipped)
        run: |
          pytest tests/test_pg_backend.py -q -rs | tee pg.log
          ! grep -q SKIPPED pg.log
      - name: Evaluation dataset labels match the documents
        run: python -m eval.run_eval --validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t documind:ci .
      - run: docker build -f Dockerfile.api -t documind-api:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
